  '<div class="legbox" id="bookingBox" style="padding:10px 12px"><p class="legcount" style="margin:0 0 8px">📅 '+T.bookTitle+'</p>'+
  '<div class="search" style="margin:0 0 4px"><select id="guidesSelect"><option value="">'+T.guidesListLabel.replace("{n}",GUIDES.length)+'</option>'+
  GUIDES.map(function(g){var fl=GUIDE_LANGS[g]||DEFAULT_GUIDE_LANG;return '<option value="'+g+'">'+g+' '+fl.join('')+'</option>'}).join("")+
  '<optgroup label="⚠️ '+T.externalGuidesLabel+'">'+EXTERNAL_GUIDES.map(function(g){var fl=GUIDE_LANGS[g]||DEFAULT_GUIDE_LANG;return '<option value="'+g+'" style="color:#ff3b3b;font-weight:700">'+'⚠️ '+g+' — '+T.externalGuidesTag+' '+fl.join('')+'</option>'}).join("")+'</optgroup>'+
  '</select></div>'+
  '<p class="msg" style="display:none;color:#fff;background:#ff3b3b;font-weight:700;margin:0 0 8px;padding:7px 11px;border-radius:8px;text-align:center" id="guideExternalWarn"></p>'+
  '<p class="msg">'+T.bookRate.replace("{fee}",GUIDE_RATE)+'</p>'+
  '<div class="row"><input type="date" class="field" id="bookDate"><input type="time" class="field" id="bookTime"></div>'+
  '<div class="row"><select class="field" id="bookHours">'+[1,2,3,4,5,6,7,8].map(function(h){return '<option value="'+h+'">'+h+' '+(h===1?T.bookHour1:T.bookHourN)+'</option>'}).join("")+'</select>'+
  '<input type="text" class="field" id="bookName" placeholder="'+T.bookNamePh+'"></div>'+
  '<div class="row"><input type="email" class="field" id="bookEmail" placeholder="'+T.bookEmailPh+'"></div>'+
  '<p class="legcount" id="bookFee"></p>'+
  '<button type="button" class="mini" id="bookBtn" style="background:#229ED9;border-color:#229ED9;color:#fff;font-weight:700">'+T.bookBtn+'</button>'+
  '<p class="msg" id="bookMsg"></p></div>';
 var hoursEl=$("bookHours"),feeEl=$("bookFee"),guideSelEl=$("guidesSelect"),warnEl=$("guideExternalWarn");
 function updateFee(){var h=parseInt(hoursEl.value,10)||1;feeEl.textContent=T.bookFee.replace("{amount}",(h*GUIDE_RATE).toFixed(0))}
 function updateGuideWarn(){
  if(!guideSelEl||!warnEl)return;
  var isExt=guideSelEl.value&&EXTERNAL_GUIDES.indexOf(guideSelEl.value)!==-1;
  warnEl.textContent=isExt?("⚠️ "+T.guideExternalWarn):"";
  warnEl.style.display=isExt?"block":"none";
 }
 if(hoursEl){hoursEl.addEventListener("change",updateFee);updateFee()}
 if(guideSelEl){guideSelEl.addEventListener("change",updateGuideWarn);updateGuideWarn()}
}
document.addEventListener("click",function(e){
 var a=e.target.closest&&e.target.closest(".themePick");
 if(!a)return;
 e.preventDefault();
 var site=SITES.filter(function(x){return x.id===a.getAttribute("data-id")})[0];
 if(!site)return;
 sel=site.id;goTo(site);draw();scrollToCard();
});
function starsHtml(mine){
 var out="";
 for(var i=1;i<=5;i++){
  out+='<button type="button" class="star" data-n="'+i+'" aria-label="'+i+'/5" aria-pressed="'+(mine>=i?"true":"false")+'">'+(mine>=i?"★":"☆")+"</button>";
 }
 return out;
}
function renderRatingBox(c){
 var box=$("ratingBox");if(!box)return;var T=TXT[lang];
 if(!CAPS.ready){box.innerHTML="";return}
 if(!CAPS.db){box.innerHTML='<p class="legcount">'+T.rateTitle+'</p><p class="legempty">'+T.needAccess+'</p>';return}
 box.innerHTML='<p class="legcount">'+T.rateTitle+'</p><div class="starsrow" id="starsRow">'+starsHtml(0)+'</div><p class="msg" id="avgMsg">'+T.loading+'</p>';
 var uidP=CAPS.user&&CAPS.user.id?CAPS.user.id():Promise.resolve(null);
 Promise.all([CAPS.db.collection("ratings").where("village","==",c.id).limit(200).get(),uidP]).then(function(r){
  var qs=r[0],uid=r[1],docs=qs.docs||[];
  var sum=0,n=0,mine=0;
  docs.forEach(function(d){var v=d.data();if(!v)return;sum+=v.stars||0;n++;if(uid&&v.uid===uid)mine=v.stars||0});
  var avgEl=$("avgMsg");
  if(avgEl)avgEl.textContent=n?((sum/n).toFixed(1)+"/5 · "+n+(n===1?T.ratingsCount1:T.ratingsCountN)):T.noRatings;
  var row=$("starsRow");if(row)row.innerHTML=starsHtml(mine);
 }).catch(function(){
  var avgEl=$("avgMsg");if(avgEl)avgEl.textContent="";
 });
}
function rateVillage(c,n){
 if(!CAPS.db||!CAPS.user||!CAPS.user.id)return;
 CAPS.user.id().then(function(uid){
  if(!uid)return;
  return CAPS.db.collection("ratings").doc(c.id+"_"+uid).set({village:c.id,uid:uid,stars:n,ts:Date.now()});
 }).then(function(){renderRatingBox(c)}).catch(function(){});
}
function renderVisitBox(c){
 var box=$("visitBox");if(!box)return;var T=TXT[lang];
 if(!CAPS.ready){box.innerHTML="";return}
 if(!CAPS.db||!CAPS.assets){box.innerHTML='<p class="legcount">'+T.visitTitle+'</p><p class="legempty">'+T.needAccess+'</p>';return}
 box.innerHTML='<p class="legcount">'+T.visitTitle+'</p><p class="legempty" style="margin:0 0 8px">'+T.visitHint+'</p>'+
  '<button type="button" class="mini outline" id="lockBtn">'+T.lockBtn+'</button>'+
  '<input type="file" accept="image/*" capture="environment" id="lockFile" style="display:none">'+
  '<p class="msg" id="lockMsg"></p><div class="visitphotos" id="visitPhotos"></div>';
 CAPS.db.collection("visits").where("village","==",c.id).limit(24).get().then(function(qs){
  var vp=$("visitPhotos");if(!vp)return;
  var docs=qs.docs||[];
  vp.innerHTML=docs.map(function(d){var v=d.data();return v&&v.photo?'<img src="/_blob/'+v.photo+'" alt="">':''}).join("");
 }).catch(function(){});
}
function lockVisit(c){
 var T=TXT[lang],msg=$("lockMsg");
 if(!navigator.geolocation){msg.textContent=T.noGeo;return}
 msg.textContent=T.locating;
 navigator.geolocation.getCurrentPosition(function(pos){
