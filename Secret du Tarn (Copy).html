<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret du Tarn (Copy)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#1c130a;--panel:#241a0f;--ink:#f2ead9;--dim:#c2ab86;--lantern:#c9a24b;--moss:#8a713a;--line:rgba(201,162,75,.35)}
/* Le Tarn Secret is always the dark Mystique theme — no light-mode auto-switch */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:
 radial-gradient(1200px 800px at 18% -8%,rgba(201,162,75,.30) 0%,transparent 62%),
 radial-gradient(1000px 700px at 100% 6%,rgba(143,45,45,.16) 0%,transparent 55%),
 radial-gradient(900px 900px at 50% 100%,rgba(138,113,58,.20) 0%,transparent 60%),
 var(--bg);
 color:var(--ink);font:16px/1.6 "Cormorant Garamond",Georgia,serif}
main{max-width:720px;margin:0 auto;padding:16px}
.eyebrow{display:block;text-align:center;letter-spacing:.35em;text-transform:uppercase;font-size:.68rem;color:var(--lantern);font-family:Inter,system-ui,sans-serif;margin:6px 0 14px;opacity:.85}
.ornament{width:110px;height:1px;background:linear-gradient(90deg,transparent,var(--lantern),transparent);margin:16px auto 20px}
.statrow{display:flex;justify-content:center;gap:0 34px;flex-wrap:wrap;margin:4px 0 20px;text-align:center;font-family:Inter,system-ui,sans-serif}
.statrow .stat b{display:block;font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:1.5rem;color:var(--lantern)}
.statrow .stat span{display:block;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.section-title{display:flex;align-items:center;gap:14px;margin:26px 0 12px}
.section-title h2{font:400 1.2rem "Playfair Display",Georgia,serif;margin:0;color:var(--ink);white-space:nowrap}
.section-title .line{flex:1;height:1px;background:var(--line)}
header{display:flex;align-items:flex-start;gap:10px;width:100%}
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;width:100%}
.brand>div{width:100%}
.logo{width:190px;height:190px;flex:0 0 auto;filter:drop-shadow(0 5px 12px rgba(0,0,0,.6));margin:0 0 -4px}
.logoRow{display:flex;align-items:center;justify-content:center;gap:5px}
.crestCore{display:flex;align-items:center;justify-content:center;gap:0}
.shieldBadge{width:42px;height:50px;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));position:relative;z-index:2}
.shieldBadge.sL{margin:0 -35px 0 0}
.shieldBadge.sR{margin:0 0 0 -35px}
.faunaBadge{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.faunaRow{display:flex;justify-content:center;margin:3px 0 0}
.pills{display:grid;grid-template-columns:repeat(2,max-content);gap:8px;justify-content:center;margin:14px auto 4px}
.pills a,.pills span{border:1px solid var(--line);padding:3.5px 8px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:.6rem;font-family:Inter,system-ui,sans-serif;letter-spacing:.02em;cursor:default;display:inline-flex;align-items:center;gap:3px}
.pills .on{background:var(--lantern);color:#1a1410;border-color:var(--lantern);font-weight:700}
.pills svg{width:10px!important;height:10px!important;vertical-align:middle!important}
.pills .on svg{fill:#1a1410!important}
.sub{color:var(--dim);margin:4px 0 0;text-align:center}
.tagline{color:var(--moss);font-weight:700;font-size:.72rem;margin:3px 0 0;text-transform:uppercase;letter-spacing:.16em;text-align:center;font-family:Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.langs{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;margin:4px 0 0;justify-content:center}
.lang{background:var(--panel);border:1px solid var(--line);border-radius:50%;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s ease,box-shadow .25s ease,border-color .25s ease}
.lang svg{width:100%;height:100%;display:block;border-radius:50%}
.lang .fl-color{opacity:0;transition:opacity .3s ease}
.lang .fl-gray{opacity:1;transition:opacity .3s ease}
.lang:hover,.lang:focus-visible{transform:translateY(-2px) scale(1.1);box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 1px var(--lantern)}
.lang:hover .fl-color,.lang:focus-visible .fl-color,.lang[aria-pressed="true"] .fl-color{opacity:1}
.lang:hover .fl-gray,.lang:focus-visible .fl-gray,.lang[aria-pressed="true"] .fl-gray{opacity:0}
.lang[aria-pressed="true"]{border-color:var(--lantern);box-shadow:0 0 0 2px var(--lantern),0 3px 10px rgba(0,0,0,.4);transform:scale(1.05)}
.lang[data-l="oc"] .occ{color:var(--dim);transition:color .3s ease}
.lang[data-l="oc"]:hover .occ,.lang[data-l="oc"]:focus-visible .occ,.lang[data-l="oc"][aria-pressed="true"] .occ{color:var(--lantern)}
@media (hover:none){.lang:active .fl-color{opacity:1}.lang:active .fl-gray{opacity:0}.lang[data-l="oc"]:active .occ{color:var(--lantern)}}
.lang:focus-visible,.pin:focus-visible,.catch:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.score{margin:16px 0 8px;display:flex;align-items:center;gap:10px;font-family:Inter,system-ui,sans-serif;font-size:.85rem}
.bar{flex:1;height:6px;background:linear-gradient(180deg,#3d2c18,#2a1d10);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--moss),var(--lantern));transition:width .4s}
.search{margin:2px 0 10px}
.search select{width:100%;font:600 1rem Inter,system-ui,sans-serif;background-color:#2a1d10;background-image:linear-gradient(180deg,#3d2c18,#2a1d10);color:var(--ink);border:1.5px solid var(--lantern);border-radius:8px;padding:10px 12px;-webkit-appearance:none;appearance:none;color-scheme:dark}
select option{background-color:#42301a;color:var(--ink)}
.customSelect{position:relative}
.customSelect-display{width:100%;font:600 1rem Inter,system-ui,sans-serif;background-color:#2a1d10;background-image:linear-gradient(180deg,#3d2c18,#2a1d10);color:var(--ink);border:1.5px solid var(--lantern);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.customSelect-display .car{color:var(--lantern);font-size:.8em;flex:0 0 auto}
.customSelect-list{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:280px;overflow-y:auto;background-color:#2a1d10;background-image:linear-gradient(180deg,#3d2c18,#2a1d10);border:1.5px solid var(--lantern);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:30;display:none}
.customSelect-list.open{display:block}
.customSelect-item{padding:9px 12px;cursor:pointer;font:600 .92rem Inter,system-ui,sans-serif;border-bottom:1px solid rgba(201,162,75,.14)}
.customSelect-item:last-child{border-bottom:none}
.customSelect-item:hover,.customSelect-item.hi{background:rgba(201,162,75,.22)}
.customSelect-item.legend{color:#e2955c}
.visually-hidden-select{position:absolute;opacity:0;pointer-events:none;height:1px;width:1px;overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.search select:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.map{background:linear-gradient(180deg,#3d2c18,#2c1e11);border:1.5px solid var(--lantern);border-radius:8px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(201,162,75,.10)}
.map svg{display:block;width:100%;height:auto}
.zoomctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoomctl button{width:34px;height:34px;border-radius:6px;background:linear-gradient(180deg,#3d2c18,#2a1d10);border:1px solid var(--lantern);color:var(--ink);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
.zoomctl button:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.zoomctl button.reset{font-size:13px}
.land{fill:var(--bg);stroke:var(--moss);stroke-width:1.5;stroke-linejoin:round}
.pin{cursor:pointer}
.pin .hit{fill:transparent;stroke:none;pointer-events:all}
.pin circle:not(.hit){fill:var(--dim);stroke:var(--bg);stroke-width:1.2;transition:r .15s}
.pin.haslegend circle:not(.hit){fill:#8f2d2d}
.pin.caught circle:not(.hit){fill:var(--lantern)}
.pin.sel circle:not(.hit){r:10;stroke:var(--ink)}
.pin text{fill:var(--ink);font-size:12px;paint-order:stroke;stroke:var(--panel);stroke-width:3px;font-family:Inter,system-ui,sans-serif}
.pin.sel text{font-size:22px;font-weight:800;stroke-width:4px}
.reftown circle{fill:var(--ink)}
.reftown text{fill:var(--ink);font-size:17px;font-weight:800;paint-order:stroke;stroke:var(--panel);stroke-width:4px;font-family:Inter,system-ui,sans-serif}
.card{margin-top:14px;background:linear-gradient(180deg,#42301a,#2e2012);border:1.5px solid var(--lantern);box-shadow:0 0 0 1px rgba(201,162,75,.12),0 10px 30px rgba(0,0,0,.35);border-radius:10px;padding:18px}
.card h2{font:400 1.5rem "Playfair Display",Georgia,serif;margin:0 0 4px;color:var(--lantern)}
.tag{color:var(--moss);font-weight:700;margin:0 0 8px;font-family:Inter,system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em}
.legbox{background:linear-gradient(180deg,#3d2c18,#2a1d10);border:1px solid var(--lantern);border-radius:8px;padding:12px 14px;margin:10px 0}
.symkey-title{font:700 .95rem "Playfair Display",Georgia,serif;letter-spacing:.03em;margin-bottom:12px;color:var(--ink)}
.symgrid{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 26px}
.symitem{display:inline-flex;align-items:center;gap:9px;font-size:.9rem;white-space:nowrap;color:var(--ink)}
#dotLegend svg{width:26px;height:26px;flex:0 0 auto}
.legcount{margin:0 0 6px;font-weight:700;color:var(--lantern);font-family:Inter,system-ui,sans-serif;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em}
details.legbox{padding:0}
details.legbox summary{list-style:none;cursor:pointer;margin:0;padding:12px 14px;font-weight:700;color:var(--lantern);font-family:Inter,system-ui,sans-serif;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;justify-content:space-between}
details.legbox summary::-webkit-details-marker{display:none}
details.legbox summary::after{content:"▾";font-size:.9rem;transition:transform .15s}
details.legbox[open] summary::after{transform:rotate(180deg)}
details.legbox .leglist{padding:0 14px 12px 32px}
.leglist{margin:0;padding-left:18px}
.leglist li{margin:0 0 8px}
.leglist li:last-child{margin-bottom:0}
.leglist a{color:var(--lantern)}
.legempty{margin:0;color:var(--dim)}
.gps{color:var(--dim);margin:6px 0}
.gps b{color:var(--ink)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lnk{background:transparent;border:1.5px solid var(--lantern);color:var(--lantern);border-radius:6px;padding:6px 14px;text-decoration:none;font-weight:700;display:inline-block;font-family:Inter,system-ui,sans-serif;font-size:.85rem}
.lnk.mail{background:var(--lantern);border-color:var(--lantern);color:#1a1410;font-weight:700;display:inline-block;margin-right:6px}
.lnk:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.catch{margin-top:10px;background:var(--lantern);color:#1a1410;border:0;border-radius:6px;padding:10px 18px;font-weight:700;font-family:Inter,system-ui,sans-serif}
.catch[disabled]{background:var(--line);color:var(--dim);cursor:default}
.mini{background:var(--lantern);color:#1a1410;border:0;border-radius:6px;padding:8px 16px;font-weight:700;font-family:Inter,system-ui,sans-serif;font-size:.85rem}
.mini[disabled]{background:var(--line);color:var(--dim);cursor:default}
.mini.outline{background:none;border:1px solid var(--lantern);color:var(--ink);font-weight:400}
.field{width:100%;font:inherit;background-color:#2a1d10;background-image:linear-gradient(180deg,#3d2c18,#2a1d10);color:var(--ink);border:1px solid var(--lantern);border-radius:6px;padding:8px 10px;margin:6px 0;font-family:Inter,system-ui,sans-serif;color-scheme:dark}
.field:focus-visible{outline:3px solid var(--lantern);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .field{flex:1;min-width:140px;margin:0}
.helperlist{margin:8px 0 0;padding-left:18px}
.helperlist li{margin:0 0 4px}
.visitphotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.visitphotos img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.msg{margin:6px 0 0;color:var(--dim);font-size:.9rem;font-family:Inter,system-ui,sans-serif}
.msg.ok{color:var(--lantern);font-weight:700}
.starsrow{display:flex;gap:2px;margin:4px 0}
.star{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--lantern);padding:2px 1px}
.star:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
.note{color:var(--dim);font-size:.85rem;margin-top:14px;font-family:Inter,system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <path d="M12 2.5 14.9 9 12 9.3 9.1 9Z" fill="#b98350" opacity="0.55"/>
   </g>
   <text x="30.3" y="41.3" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif" font-weight="700" font-size="18" fill="#2e2210" opacity="0.5">Le81</text>
   <text x="30" y="40" text-anchor="middle" dominant-baseline="central" font-family="Georgia,serif" font-weight="700" font-size="18" fill="#3a2a12">Le81</text>
  </svg>
  <svg class="logo" id="logoSvg" viewBox="0 0 260 260" role="img" aria-label="Secret du Tarn — 81">
   <defs>

    <textPath id="taglineArc" href="#textArcBottom" startOffset="50%" text-anchor="middle"></textPath>
   </text>
  </svg>
  <svg class="shieldBadge sR" viewBox="0 0 60 72" role="img" aria-label="Le 81">
   <path d="M30 2 C16 2 6 6 6 6 L6 32 C6 52 16 64 30 70 C44 64 54 52 54 32 L54 6 C54 6 44 2 30 2 Z" fill="url(#shieldGoldL)" stroke="#3a2a12" stroke-width="2"/>
   <path d="M30 5 C18 5 9 8.3 9 8.3 L9 31.5 C9 49.5 18 60 30 65.6 C42 60 51 49.5 51 31.5 L51 8.3 C51 8.3 42 5 30 5 Z" fill="none" stroke="#5c461f" stroke-width="1" opacity="0.65"/>

 "noailhac":[{t:{fr:"Les gîtes de pèlerins de Noailhac",en:"The Pilgrim Lodges of Noailhac",oc:"Los gîtes de pelegrins de Noalhac",de:"Die Pilgerherbergen von Noailhac",ja:"ノアイヤックの巡礼者宿"},s:{fr:"Noailhac, étape de la voie d'Arles (GR653) au pied de la Montagne Noire, propose plusieurs gîtes aux pèlerins, dont « Chez André et Pierrette » et « la Truie qui file », avant la montée vers Castres.",en:"Noailhac, a stage on the Via Arletanensis (GR653) at the foot of the Montagne Noire, offers several lodges to pilgrims, including 'Chez André et Pierrette' and 'la Truie qui file', before the climb toward Castres.",oc:"Noalhac, etapa de la via d'Arle (GR653) al pè de la Montanha Negra, propausa mantun gîtes als pelegrins, coma « Chez André et Pierrette » e « la Truie qui file », abans la montada cap a Castras.",de:"Noailhac, eine Etappe des Via Arletanensis (GR653) am Fuße der Montagne Noire, bietet Pilgern mehrere Herbergen, darunter „Chez André et Pierrette“ und „la Truie qui file“, vor dem Anstieg nach Castres.",ja:"モンターニュ・ノワール山麓、アルル道（GR653）の宿場ノアイヤックには、「シェ・アンドレ・エ・ピエレット」や「ラ・トリュイ・キ・フィル」など複数の巡礼宿があり、カストルへの登りの前に巡礼者を迎える。"},src:"https://www.santiagooo.com/ville-village-etape/noailhac-b4689000-97e8-4183-bcf9-4e59622eaa00",st:"tourism"}],
 "boissezon":[{t:{fr:"Le gîte « Le Saint-Jacques » de Boissezon",en:"The 'Le Saint-Jacques' Pilgrim Lodge of Boissezon",oc:"Lo gîte « Lo Sant Jaume » de Boisseson",de:"Die Pilgerherberge „Le Saint-Jacques“ in Boissezon",ja:"ボワズゾンの巡礼宿「ル・サン＝ジャック」"},s:{fr:"Boissezon, village perché de la voie d'Arles (GR653) au pied de la Montagne Noire, possède un gîte d'étape communal nommé « Le Saint-Jacques », signe de son ancrage dans l'accueil des pèlerins en route vers Castres.",en:"Boissezon, a hilltop village on the Via Arletanensis (GR653) at the foot of the Montagne Noire, has a communal pilgrim lodge named 'Le Saint-Jacques', a sign of its long tradition of welcoming pilgrims on their way to Castres.",oc:"Boisseson, vilatge naut de la via d'Arle (GR653) al pè de la Montanha Negra, possedís un gîte d'etapa comunal nomenat « Lo Sant Jaume », signe de son ancratge dins l'acuèlh dels pelegrins en camin cap a Castras.",de:"Boissezon, ein Bergdorf am Via Arletanensis (GR653) am Fuße der Montagne Noire, besitzt eine kommunale Pilgerherberge namens „Le Saint-Jacques“ — ein Zeichen seiner langen Tradition, Pilger auf dem Weg nach Castres zu beherbergen.",ja:"モンターニュ・ノワールの麓、アルル道（GR653）沿いの高台の村ボワズゾンには、「ル・サン＝ジャック」という名の共同巡礼宿があり、カストルへ向かう巡礼者を受け入れてきた伝統を物語る。"},src:"https://www.santiagooo.com/ville-village-etape/boissezon",st:"tourism"}],
 "angles":[{t:{fr:"Les graffitis de pèlerins de la commanderie d'Anglès",en:"The Pilgrim Graffiti of the Anglès Commandery",oc:"Los grafitis de pelegrins de la comanda d'Anglés",de:"Die Pilgergraffiti der Komturei von Anglès",ja:"アングレ管区教会の巡礼者の落書き"},s:{fr:"La commanderie d'Anglès, d'abord templière puis hospitalière, avec sa chapelle du XIIe siècle, servait de halte importante sur le chemin de Compostelle : des graffitis laissés par des pèlerins y ont été identifiés et étudiés par le groupe de recherche archéologique GRAHT.",en:"The Anglès commandery, first Templar then Hospitaller, with its 12th-century chapel, served as an important stop on the road to Compostela: graffiti left by pilgrims there has been identified and studied by the GRAHT archaeological research group.",oc:"La comanda d'Anglés, d'en primièr templièra puèi espitalièra, ambe sa capèla del sègle XII, servissiá de pausada importanta sul camin de Compostèla : de grafitis daissats per de pelegrins i son estats identificats e estudiats pel grop de recèrca arqueologic GRAHT.",de:"Die Komturei von Anglès, zunächst Templer- dann Johanniterkomturei, mit ihrer Kapelle aus dem 12. Jahrhundert, diente als wichtige Station auf dem Weg nach Compostela: dort hinterlassene Pilgergraffiti wurden von der archäologischen Forschungsgruppe GRAHT identifiziert und untersucht.",ja:"最初はテンプル騎士団、後にホスピタル騎士団の管区教会だったアングレの12世紀の礼拝堂は、コンポステーラへの道の重要な宿場だった。巡礼者が残した落書きが発見され、考古学研究グループGRAHTによって研究されている。"},src:"https://fr.wikipedia.org/wiki/Commanderie_d'Angles",st:"heritage"}],
 "murat-sur-vebre":[{t:{fr:"L'étape des menhirs sur le chemin d'Arles",en:"The Menhirs' Stage on the Chemin d'Arles",oc:"L'etapa dels menhirs sul camin d'Arle",de:"Die Menhir-Etappe auf dem Arles-Weg",ja:"アルル道の巨石記念物の宿場"},s:{fr:"Étape traditionnelle de la voie d'Arles (GR653) vers Compostelle, Murat-sur-Vèbre est connue pour ses célèbres statues-menhirs néolithiques du Haut-Languedoc visibles près du chemin, bien qu'aucune trace documentée d'un hospice ou d'une légende de pèlerins ne subsiste pour le village lui-même.",en:"A traditional stage on the Via Arletanensis (GR653) to Compostela, Murat-sur-Vèbre is known for its famous Neolithic statue-menhirs of the Haut-Languedoc visible near the path, though no documented pilgrim hospice or legend survives for the village itself.",oc:"Etapa tradicionala de la via d'Arle (GR653) cap a Compostèla, Murat-sus-Vèbre es coneguda per sas celèbras estatuas-menhirs neoliticas del Naut-Lengadòc visiblas prèp del camin, quitament se cap de traça documentada d'un espital o d'una legenda de pelegrins subsista pas pel vilatge el-meteis.",de:"Eine traditionelle Etappe des Via Arletanensis (GR653) nach Compostela, Murat-sur-Vèbre ist bekannt für seine berühmten neolithischen Menhir-Statuen des Haut-Languedoc in der Nähe des Weges, auch wenn kein dokumentiertes Pilgerhospiz oder eine Legende für das Dorf selbst überliefert ist.",ja:"コンポステーラへの道（GR653、アルル道）の伝統的な宿場ミュラ＝シュル＝ヴェーブルは、道沿いに見られる新石器時代の有名な人物像メンヒルで知られるが、村自体に関する巡礼者宿泊所や伝説の記録は残っていない。"},src:"https://www.santiagooo.com/ville-village-etape/murat-sur-vebre",st:"tourism"}],
 "milhars":[{t:{fr:"Le dolmen du Roc de la Vierge",en:"The Roc de la Vierge Dolmen",oc:"Lo dolmen del Ròc de la Verge",de:"Der Dolmen von Roc de la Vierge",ja:"ロック・ド・ラ・ヴィエルジュのドルメン"},s:{fr:"(non officiel) Dolmen à la table fendue et aux piliers assez enfoncés dans le sol, ce qui rend sa forme difficile à reconnaître ; contrairement au dolmen de Peyrelevade tout proche, il ne bénéficie d'aucune protection au titre des monuments historiques. (non officiel)",en:"(unofficial) A dolmen with a cracked capstone and pillars sunk fairly deep into the ground, making its shape hard to make out; unlike the nearby Peyrelevade dolmen, it enjoys no historic-monument protection. (unofficial)",oc:"(non oficial) Dolmen amb la taula fendasclada e los pilars fòrça enfonsats dins lo sòl, çò que rend sa forma dificila de reconéisser ; al contrari del dolmen de Peirelevada tot prèp, beneficia pas d'auquna proteccion al títol dels monuments istorics. (non oficial)",de:"(inoffiziell) Ein Dolmen mit gerissener Deckplatte und ziemlich tief im Boden versunkenen Pfeilern, was seine Form schwer erkennbar macht; anders als der nahegelegene Dolmen von Peyrelevade genießt er keinen Denkmalschutz. (inoffiziell)",ja:"（非公式）天板にひびが入り、支柱が地中深く沈んでいるため形がわかりにくいドルメン。すぐ近くのペレルヴァードのドルメンとは異なり、歴史的記念物としての保護は受けていない。（非公式）"},src:"https://www.sitesetmonuments.org/milhars-tarn-le-dolmen-et-le-mat-de-mesure",st:"assoc"}],
 "alos":[{t:{fr:"Le dolmen du Cayrou de l'Empiri",en:"The Cayrou de l'Empiri Dolmen",oc:"Lo dolmen del Cairon de l'Empèri",de:"Der Dolmen von Cayrou de l'Empiri",ja:"カイル・ド・ランピリのドルメン"},s:{fr:"Unique dolmen à couloir répertorié dans le Tarn, formé d'une chambre rectangulaire dans un tumulus ovale de 16 mètres de long. Il a été entièrement détruit en 1974 par des travaux agricoles et n'est donc plus visible sur le terrain.",en:"The only passage dolmen recorded in the Tarn, formed of a rectangular chamber within a 16-metre-long oval tumulus. It was completely destroyed in 1974 by farm work and is therefore no longer visible on the ground.",oc:"Solet dolmen a corredor repertoriat dins lo Tarn, format d'una cambra rectangulara dins un tumulus oval de 16 mètres de long. Foguèt entièrament destrusit en 1974 per de trabalhs agricòlas e es donc pas mai visible sul terren.",de:"Der einzige im Tarn verzeichnete Gangdolmen, bestehend aus einer rechteckigen Kammer in einem 16 Meter langen ovalen Grabhügel. Er wurde 1974 durch landwirtschaftliche Arbeiten vollständig zerstört und ist vor Ort nicht mehr sichtbar.",ja:"タルヌ県で唯一記録されている羨道付きドルメンで、長さ16メートルの楕円形墳丘の中に長方形の玄室がある。1974年の農作業により完全に破壊され、現地ではもはや見ることができない。"},src:"https://fr.wikipedia.org/wiki/Dolmen_du_Cayrou_de_l%27Empiri",st:"heritage"}],
 "sainte-cecile-du-cayrou":[{t:{fr:"Le dolmen de Saint-Paul",en:"The Saint-Paul Dolmen",oc:"Lo dolmen de Sant Pau",de:"Der Dolmen von Saint-Paul",ja:"サン＝ポールのドルメン"},s:{fr:"Dolmen composé de trois orthostates et d'une table de couverture en calcaire local, aussi appelé « Pierre Levée » ; fouillé clandestinement puis étudié, il a livré soixante-douze silex et six tessons de poterie, et est classé monument historique depuis 1889.",en:"A dolmen made of three orthostats and a local limestone capstone, also known as the 'Pierre Levée' (raised stone); after being illicitly dug into and later studied, it yielded seventy-two flints and six pottery shards, and has been listed as a historic monument since 1889.",oc:"Dolmen compausat de tres ortostats e d'una taula de cobertura en calcari local, tanben nomenat « Pèira Levada » ; excavat clandestinament puèi estudiat, liurèt setanta-dos silèxs e sièis tèst de terralha, e es classat monument istoric dempuèi 1889.",de:"Ein Dolmen aus drei Tragsteinen und einer Deckplatte aus örtlichem Kalkstein, auch „Pierre Levée“ (aufgerichteter Stein) genannt; nach heimlicher Ausgrabung und späterer Untersuchung wurden zweiundsiebzig Feuersteine und sechs Keramikscherben gefunden. Seit 1889 als historisches Denkmal eingestuft.",ja:"3本の側石と地元産石灰岩の天板からなるドルメンで、「ピエール・ルヴェ（起立石）」とも呼ばれる。無許可の発掘後に調査され、72点の火打石と6点の土器片が出土した。1889年から歴史的記念物に指定されている。"},src:"https://fr.wikipedia.org/wiki/Dolmen_de_Saint-Paul",st:"heritage"}],
 "labastide-rouairoux":[{t:{fr:"Le dolmen du Plo de Laganthe",en:"The Plo de Laganthe Dolmen",oc:"Lo dolmen del Plò de Laganta",de:"Der Dolmen von Plo de Laganthe",ja:"プロ・ド・ラガントのドルメン"},s:{fr:"Dolmen néolithique simple à quatre pierres dont la table pèse environ 21 tonnes, situé en zone granitique du sud du Tarn où ces monuments sont rares. La légende locale l'attribue à la Vierge, qui aurait abandonné là les pierres destinées à une église après s'être fâchée contre les habitants de Soulié.",en:"A simple four-stone Neolithic dolmen whose capstone weighs about 21 tonnes, standing in a granite area of the southern Tarn where such monuments are rare. Local legend attributes it to the Virgin Mary, who is said to have abandoned there the stones meant for a church after growing angry with the people of Soulié.",oc:"Dolmen neolitic simple a quatre pèiras que sa taula pesa environ 21 tonas, situat en zòna granitica del sud del Tarn ont aquestes monuments son rars. La legenda locala l'atribuís a la Verge, qu'auriá abandonat aquí las pèiras destinadas a una glèisa aprèp s'èsser encolerizada contra los abitants de Solièr.",de:"Ein einfacher neolithischer Vier-Stein-Dolmen, dessen Deckplatte etwa 21 Tonnen wiegt, in einem Granitgebiet im Süden des Tarn, wo solche Monumente selten sind. Der örtlichen Legende nach ließ die Jungfrau Maria hier die für eine Kirche bestimmten Steine liegen, nachdem sie sich über die Bewohner von Soulié geärgert hatte.",ja:"天板の重さが約21トンある4石からなる新石器時代の単純なドルメンで、このような遺構が珍しいタルヌ県南部の花崗岩地帯にある。地元の伝説では、スリエの住民に腹を立てた聖母マリアが教会用に運んでいた石をここに置き去りにしたとされる。"},src:"https://fr.wikipedia.org/wiki/Dolmen_du_Plo_de_Laganthe",st:"heritage"}],
 "amarens":[{t:{fr:"Les grottes meulières d'Amarens",en:"The Amarens Millstone Caves",oc:"Las baumos meliroas d'Amarens",de:"Die Mühlsteinhöhlen von Amarens",ja:"アマランの石臼採石洞窟"},s:{fr:"(non officiel) Cinq carrières souterraines artificielles creusées dans le calcaire pour l'extraction de meules, exploitées du Moyen Âge jusqu'en 1840 ; la carrière de Combals s'est effondrée aux XVIIe-XVIIIe siècles, ensevelissant des ouvriers et leurs bœufs d'attelage. (non officiel)",en:"(unofficial) Five artificial underground quarries cut into the limestone to extract millstones, worked from the Middle Ages until 1840; the Combals quarry collapsed in the 17th-18th centuries, burying workers and their draught oxen. (unofficial)",oc:"(non oficial) Cinc pèiras sosterranhas artificialas cavadas dins lo calcari per l'extraccion de mòlas, exploitadas dempuèi l'Edat Mejana fins a 1840 ; la pèira de Combals s'esfondrèt als sègles XVII-XVIII, ensevelissent d'obrièrs e sos buòus d'atalatge. (non oficial)",de:"(inoffiziell) Fünf künstliche unterirdische Steinbrüche im Kalkstein zur Mühlsteingewinnung, genutzt vom Mittelalter bis 1840; der Steinbruch von Combals stürzte im 17./18. Jahrhundert ein und begrub Arbeiter samt ihren Zugochsen. (inoffiziell)",ja:"（非公式）石灰岩を掘って石臼を採取した5つの人工地下採石場で、中世から1840年まで稼働した。コンバル採石場は17〜18世紀に崩落し、労働者と使役牛を生き埋めにした。（非公式）"},src:"https://capa-archeo.fr/les-magnifiques-grottes-meulieres-damarens/",st:"assoc"}],
 "penne":[{t:{fr:"La grotte du Courbet",en:"The Courbet Cave",oc:"La baumo del Courbet",de:"Die Höhle von Courbet",ja:"クルベ洞窟"},s:{fr:"Site préhistorique magdalénien, vieux d'environ 13 400 ans, situé dans les gorges de l'Aveyron ; fouillé dès les années 1860 puis en 1985-1986, il a livré la « Vénus de Courbet » et de nombreux objets en os gravé.",en:"A Magdalenian prehistoric site around 13,400 years old, located in the Aveyron gorges; excavated from the 1860s and again in 1985-86, it yielded the 'Venus of Courbet' and numerous engraved bone objects.",oc:"Site preïstoric magdalenian, vièlh d'environ 13 400 ans, situat dins las gòrjas de l'Avairon ; excavat dempuèi los ans 1860 puèi en 1985-1986, liurèt la « Venús de Courbet » e nombroses objèctes en òs gravat.",de:"Eine etwa 13.400 Jahre alte magdalénienzeitliche Fundstätte in der Aveyron-Schlucht; bereits ab den 1860er Jahren und erneut 1985-86 ausgegraben, brachte sie die „Venus von Courbet“ und zahlreiche gravierte Knochenobjekte zutage.",ja:"アヴェロン渓谷にある約13400年前のマドレーヌ文化期の遺跡。1860年代と1985〜86年に発掘され、「クルベのヴィーナス」や彫刻を施した骨製品が多数出土した。"},src:"https://fr.wikipedia.org/wiki/Grotte_du_Courbet",st:"heritage"},{t:{fr:"Le dolmen des Alberts",en:"The Alberts Dolmen",oc:"Lo dolmen dels Alberts",de:"Der Dolmen von Alberts",ja:"アルベールのドルメン"},s:{fr:"(non officiel) Dolmen en ruine près du domaine des Alberts, dont il subsiste un tumulus de pierres sèches et de terre d'environ 2 m de haut sur 7 m de diamètre ; l'une de ses dalles, déplacée à environ 3 m, aurait servi de pare-vent à des chasseurs. (non officiel)",en:"(unofficial) A ruined dolmen near the Alberts estate, of which a dry-stone and earth tumulus about 2 m high and 7 m across survives; one of its slabs, moved about 3 m away, is said to have served hunters as a windbreak. (unofficial)",oc:"(non oficial) Dolmen en roïnas prèp del domeni dels Alberts, del qual demòra un tumulus de pèiras secas e de tèrra d'environ 2 m d'aut sus 7 m de diamètre ; una de sas dalas, desplaçada a environ 3 m, auriá servit de parapluèja als caçaires. (non oficial)",de:"(inoffiziell) Ein verfallener Dolmen nahe dem Anwesen Alberts, von dem ein Trockenmauer- und Erdhügel von etwa 2 m Höhe und 7 m Durchmesser erhalten ist; eine seiner Platten, etwa 3 m verschoben, soll Jägern als Windschutz gedient haben. (inoffiziell)",ja:"（非公式）アルベール領地近くにある崩れたドルメンで、高さ約2m、直径7mの石積み土塚が残る。約3m動かされた石板の一枚は、猟師の風よけとして使われたと伝わる。（非公式）"},src:"https://www.megalithic.co.uk/article.php?sid=42703",st:"assoc"}],
 "lavaur":[{t:{fr:"Le Jacquemart de Lavaur",en:"The Jacquemart of Lavaur",oc:"Lo Jaquemart de Lavaur",de:"Der Jacquemart von Lavaur",ja:"ラヴォールのジャックマール"},s:{fr:"Cet automate de bois frappe les heures sur la cathédrale Saint-Alain ; la tradition locale veut qu'il ait été façonné par un prisonnier condamné à sonner les heures sans jamais s'arrêter.",en:"This wooden automaton strikes the hours on Saint-Alain cathedral; local tradition holds it was carved by a prisoner condemned to ring the hours without ever stopping.",oc:"Aqueste automat de bòsc pica las oras sus la catedrala Sant Alan ; la tradicion locala ditz qu'auríà estat fach per un presonièr condemnat a sonar las oras shens jamai s'arrestar.",de:"Dieser hölzerne Automat schlägt die Stunden an der Kathedrale Saint-Alain; der örtlichen Überlieferung nach wurde er von einem Gefangenen geschnitzt, der dazu verurteilt war, die Stunden zu läuten, ohne je aufzuhören.",ja:"この木製の自動人形はサン＝タラン大聖堂で時を告げる。地元の言い伝えによれば、決して止まることなく時を鳴らし続ける刑を科された囚人が作ったとされる。"},src:"https://www.tourisme-tarn.com/les-mysteres-et-legendes-du-tarn/",st:"tourism"}],
 "lacrouzette":[{t:{fr:"Le Roc de l'Oie",en:"The Goose Rock",oc:"Lo Ròc de l'Auca",de:"Der Gänsefelsen",ja:"ガチョウの岩"},s:{fr:"Dans le chaos granitique du Sidobre, un sorcier aurait changé son oie géante en pierre pour l'avoir laissée dehors après le lever du soleil.",en:"Amid the granite boulders of the Sidobre, a sorcerer is said to have turned his giant goose to stone for leaving it outside after sunrise.",oc:"Dins lo caòs granitic del Sidòbre, un masc auriá cambiat son auca gigantassa en pèira per l'aver daissada defòra aprèp lo levant del solelh.",de:"Inmitten des Granit-Chaos des Sidobre soll ein Zauberer seine riesige Gans in Stein verwandelt haben, weil er sie nach Sonnenaufgang draußen gelassen hatte.",ja:"シドブルの花崗岩地帯で、ある魔法使いが日の出後も外に置き忘れた巨大なガチョウを石に変えてしまったという。"},src:"https://www.tourisme-tarn.com/les-mysteres-et-legendes-du-tarn/",st:"tourism"},{t:{fr:"La Peyro Clabado",en:"The Peyro Clabado",oc:"La Pèira Clavada",de:"Der Peyro Clabado",ja:"ペイロ・クラバド"},s:{fr:"(non officiel) Ce rocher de granit d'environ 800 tonnes, en équilibre miraculeux sur à peine un mètre carré dans le Sidobre, était réputé être l'œuvre du diable ou de forces surnaturelles ayant cloué la pierre à cet endroit. (non officiel)",en:"(unofficial) This roughly 800-tonne granite boulder, miraculously balanced on barely one square metre in the Sidobre, was said to be the work of the devil or supernatural forces that nailed the stone in place. (unofficial)",oc:"(non oficial) Aquesta ròca de granit d'environ 800 tonas, en equilibri miraculós sus tot just un mètre carrat dins lo Sidòbre, èra renomada per èsser l'òbra del diable o de fòrças sobrenaturalas qu'aurián clavat la pèira a aquel endrech. (non oficial)",de:"(inoffiziell) Dieser rund 800 Tonnen schwere Granitfelsen, wundersam auf kaum einem Quadratmeter im Sidobre balanciert, galt als das Werk des Teufels oder übernatürlicher Kräfte, die den Stein dort festgenagelt hätten. (inoffiziell)",ja:"（非公式）シドブルにあるこの約800トンの花崗岩の巨石は、わずか1平方メートルほどの上に奇跡的にバランスを保っており、悪魔や超自然の力がその場に打ち付けたものだと言われていた。（非公式）"},src:"https://labonnevague.com/2024/01/15/le-sidobre-contree-mysterieuse-dhistoires-et-de-legendes/",st:"blog"}],
 "saint-sulpice-la-pointe":[{t:{fr:"Le souterrain de la duchesse",en:"The Duchess's Tunnel",oc:"Lo sosterran de la duquessa",de:"Der Tunnel der Herzogin",ja:"公爵夫人の地下道"},s:{fr:"Un passage souterrain médiéval du village garderait le souvenir d'une duchesse ruinée qui y aurait fabriqué de la fausse monnaie pour survivre au XVe siècle.",en:"A medieval underground passage in the village is said to preserve the memory of a ruined duchess who supposedly forged counterfeit coins there to survive in the 15th century.",oc:"Un passatge sosterranh medieval del vilatge gardariá lo sovenir d'una duquessa arroïnada qu'i auriá fabricat de falsa moneda per subreviure al sègle XV.",de:"Ein mittelalterlicher unterirdischer Gang im Dorf soll an eine verarmte Herzogin erinnern, die dort im 15. Jahrhundert angeblich Falschgeld prägte, um zu überleben.",ja:"村に残る中世の地下道は、15世紀に生き延びるためそこで偽造硬貨を作ったとされる没落した公爵夫人の記憶をとどめているという。"},src:"https://www.tourisme-tarn.com/les-mysteres-et-legendes-du-tarn/",st:"tourism"},{t:{fr:"Le souterrain du Castela",en:"The Castela Underground Passage",oc:"Lo sosterranh del Castela",de:"Der unterirdische Gang von Castela",ja:"カステラの地下通路"},s:{fr:"Un souterrain-refuge de 142 mètres, creusé au pic de fer sous le château du Castela et probablement antérieur à celui-ci, aurait servi de cachette à Jeanne de Boulogne, dite « Jeanne la Faussaire », qui y aurait battu de la fausse monnaie au XVe siècle.",en:"A 142-metre refuge tunnel, dug with iron picks beneath the Castela castle and probably predating it, is said to have hidden Jeanne de Boulogne, known as 'Jeanne la Faussaire' (Jeanne the Forger), who allegedly minted counterfeit coins there in the 15th century.",oc:"Un sosterranh-refugi de 142 mètres, cavat al pic de fèrre jos lo castèl del Castela e probablament anterior a el, auriá servit de rescondilha a Joana de Bolonha, dicha « Joana la Falsaira », qu'i auriá batut de falsa moneda al sègle XV.",de:"Ein 142 Meter langer Fluchttunnel, mit Eisenpickeln unter dem Schloss Castela gegraben und vermutlich älter als dieses, soll Jeanne de Boulogne, genannt „Jeanne la Faussaire“ (die Fälscherin), als Versteck gedient haben, wo sie im 15. Jahrhundert angeblich Falschgeld prägte.",ja:"鉄製の道具で掘られた142メートルの避難用地下道はカステラ城の下にあり、城そのものより古いとされる。15世紀に偽造硬貨を作ったとされる「贋金作りのジャンヌ」ことジャンヌ・ド・ブローニュの隠れ家だったと伝わる。"},src:"https://www.tourisme-tarnagout.com/decouvrir-et-visiter/le-souterrain-medieval-du-castela-saint-sulpice/",st:"tourism"}],
 "lacaune":[{t:{fr:"L'enfant sauvage de Lacaune",en:"The Wild Child of Lacaune",oc:"L'enfant salvatge de Lacauna",de:"Das wilde Kind von Lacaune",ja:"ラコーヌの野生児"},s:{fr:"La tradition orale locale raconte qu'un enfant aurait survécu seul, pendant plusieurs années, dans les forêts qui entourent le village.",en:"Local oral tradition tells of a child who is said to have survived alone, for several years, in the forests surrounding the village.",oc:"La tradicion orala locala conta qu'un enfant auriá subreviscut sol, pendent mantunas annadas, dins los bòscs que enròdan lo vilatge.",de:"Der örtlichen mündlichen Überlieferung nach soll ein Kind mehrere Jahre lang allein in den das Dorf umgebenden Wäldern überlebt haben.",ja:"地元の口承によれば、ある子どもが村を囲む森の中で何年もの間一人で生き延びたという。"},src:"https://www.tourisme-tarn.com/les-mysteres-et-legendes-du-tarn/",st:"tourism"}],
 "lautrec":[{t:{fr:"Les caves creusées dans le roc",en:"The Cellars Carved into the Rock",oc:"Las cavas cavadas dins lo ròc",de:"Die in den Fels gehauenen Keller",ja:"岩に掘られた地下貯蔵庫"},s:{fr:"Le grès tendre sur lequel repose Lautrec est percé de centaines de cavités utilisées comme caves et puits, qui donnent au village, dit-on, des allures de gruyère.",en:"The soft sandstone on which Lautrec sits is pierced by hundreds of cavities used as cellars and wells, said to give the village the look of a Swiss cheese.",oc:"Lo gres blan sus lo qual repausa Lautrèc es traucat de centenats de cavitats emplegadas coma cavas e potz, que balhan al vilatge, çò's ditz, un aire de gruèra.",de:"Der weiche Sandstein, auf dem Lautrec steht, ist von Hunderten Höhlen durchzogen, die als Keller und Brunnen dienen und dem Dorf angeblich das Aussehen eines Schweizer Käses verleihen.",ja:"ロートレックが建つ柔らかな砂岩には貯蔵庫や井戸として使われる無数の穴が開いており、村はまるでグリュイエールチーズのようだと言われる。"},src:"https://www.tourisme-tarn.com/les-mysteres-et-legendes-du-tarn/",st:"tourism"}],
 "vaour":[{t:{fr:"Le trésor des Templiers",en:"The Templars' Treasure",oc:"Lo tresaur dels Templièrs",de:"Der Schatz der Templer",ja:"テンプル騎士団の財宝"},s:{fr:"La commanderie templière de Vaour reste associée, dans la mémoire locale, à un trésor que les chevaliers auraient caché avant leur arrestation en 1307.",en:"The Templar commandery of Vaour remains linked, in local memory, to a treasure the knights are said to have hidden before their arrest in 1307.",oc:"La comanda templièra de Vaour demòra ligada, dins la memòria locala, a un tresaur que los cavalièrs aurián amagat abans lor arrestacion en 1307.",de:"Die Templerkommende von Vaour wird in der lokalen Erinnerung mit einem Schatz in Verbindung gebracht, den die Ritter vor ihrer Verhaftung 1307 versteckt haben sollen.",ja:"ヴァウールのテンプル騎士団支部は、1307年の逮捕前に騎士たちが隠したとされる財宝にまつわる言い伝えと結びついている。"},src:"https://www.lunetoile.com/2023/09/25/commanderie-templiere-de-vaour-81/",st:"blog"},{t:{fr:"Le dolmen de Peyrelevade",en:"The Peyrelevade Dolmen",oc:"Lo dolmen de Peirelevada",de:"Der Dolmen von Peyrelevade",ja:"ペレルヴァードのドルメン"},s:{fr:"Sépulture collective mégalithique vieille de plus de 5000 ans, formée de dalles verticales et d'une table de couverture fissurée et affaissée. Classé monument historique dès 1889, c'est l'exemple le plus emblématique des dolmens du Tarn.",en:"A megalithic collective burial chamber over 5000 years old, formed of upright slabs and a cracked, sagging capstone. Listed as a historic monument as early as 1889, it is the most iconic of the Tarn's dolmens.",oc:"Sepultura collectiva megalitica de mai de 5000 ans, formada de dalas verticalas e d'una taula de cobertura fendasclada e afondrada. Classat monument istoric dempuèi 1889, es l'exemple mai emblematic dels dolmens del Tarn.",de:"Eine über 5000 Jahre alte megalithische Kollektivgrabstätte aus aufrechten Platten und einer gerissenen, eingesunkenen Deckplatte. Bereits 1889 als historisches Denkmal eingestuft, ist er das bekannteste Beispiel unter den Dolmen des Tarn.",ja:"5000年以上前の集団埋葬用巨石墓で、垂直の石板とひび割れて沈んだ天板からなる。1889年に歴史的記念物に指定された、タルヌ県で最も象徴的なドルメン。"},src:"https://fr.wikipedia.org/wiki/Dolmen_de_Peyrelevade",st:"heritage"}],
 "burlats":[{t:{fr:"La légende d'Adélaïde de Burlats",en:"The Legend of Adélaïde de Burlats",oc:"La legenda d'Adelaïda de Burlats",de:"Die Legende von Adélaïde de Burlats",ja:"アデライード・ド・ビュルラの伝説"},s:{fr:"Adélaïde de Burlats, fille d'Aliénor de Champagne, tenait au XIIe siècle une cour d'amour réputée au prieuré de Burlats, mêlant troubadours et raffinement courtois. Son pavillon, dit « Pavillon d'Adélaïde », reste associé à cette légende de cour galante et poétique transmise par la tradition locale.",en:"In the 12th century, Adélaïde de Burlats, daughter of Eleanor of Champagne, is said to have held a renowned court of love at the Burlats priory, blending troubadours and courtly refinement. Her pavilion, known as the “Pavillon d'Adélaïde,” remains tied to this legend of gallant, poetic courtly life passed down by local tradition.",oc:"Al sègle XII, Adelaïda de Burlats, filha d'Alienòr de Champanha, tenguèt al priorat de Burlats una cort d'amor renomada, mesclant trobadors e rafinament cortés. Son pavilhon, dich «Pavilhon d'Adelaïda», demòra ligat a aquesta legenda de cort galanta e poëtica transmesa per la tradicion locala.",de:"Im 12. Jahrhundert soll Adélaïde de Burlats, Tochter der Eleonore von Champagne, im Priorat von Burlats einen berühmten Liebeshof unterhalten haben, an dem Troubadoure und höfische Verfeinerung zusammenkamen. Ihr Pavillon, der „Pavillon d'Adélaïde“, bleibt mit dieser Legende galanter, poetischer Hofkultur verbunden, die von der lokalen Überlieferung weitergegeben wird.",ja:"12世紀、シャンパーニュ伯妃エレオノールの娘アデライード・ド・ビュルラは、ビュルラ修道院で吟遊詩人と洗練された宮廷風の愛を育む有名な「愛の宮廷」を開いたと伝えられる。彼女のあずまや「パヴィヨン・ダデライード」は、地元の伝承によって語り継がれるこの雅やかで詩的な宮廷の伝説と結びついている。"},src:"https://www.tourisme-tarn.com/ecouter-legende-dadelaide-de-burlats/",st:"tourism"}],
 "cordes-sur-ciel":[{t:{fr:"La légende du puits des inquisiteurs",en:"The Legend of the Inquisitors' Well",oc:"La legenda del potz dels inquisitors",de:"Die Legende vom Brunnen der Inquisitoren",ja:"異端審問官の井戸の伝説"},s:{fr:"(non officiel) En 1233, trois inquisiteurs dominicains venus condamner un hérétique cathare auraient été tués par les habitants de Cordes, qui jetèrent leurs corps dans un puits de la ville — valant à Cordes 88 ans d'excommunication. Réouvert en 1826, on n'en aurait jamais atteint le fond. (non officiel)",en:"(unofficial) In 1233, three Dominican inquisitors who came to condemn a Cathar heretic are said to have been killed by the people of Cordes, who threw their bodies down a well in the town — earning Cordes 88 years of excommunication. Reopened in 1826, the well's bottom was supposedly never reached. (unofficial)",oc:"(non oficial) En 1233, tres inquisitors dominicans venguts condemnar un eretic catar aurián estat tuats pels abitants de Còrdas, que getèron lors còssses dins un potz de la vila — çò que valguèt a Còrdas 88 ans d'excomunicacion. Redobèrt en 1826, se n'auriá jamai atengut lo fons. (non oficial)",de:"(inoffiziell) Im Jahr 1233 sollen drei Dominikaner-Inquisitoren, die gekommen waren, um einen Katharer zu verurteilen, von den Bewohnern von Cordes getötet worden sein, die ihre Leichen in einen Brunnen der Stadt warfen — was Cordes 88 Jahre Exkommunikation einbrachte. Der 1826 wieder geöffnete Brunnen soll nie bis zum Grund ausgehoben worden sein. (inoffiziell)",ja:"（非公式）1233年、カタリ派の異端者を断罪しに来た3人のドミニコ会異端審問官が、コルド村の住民たちに殺され、遺体が町の井戸に投げ込まれたと伝えられる。これによりコルドは88年間破門された。1826年に再び開けられたこの井戸は、底まで達することがなかったという。（非公式）"},src:"https://fr.anecdotrip.com/une-chute-dans-les-tenebres-humides-la-legende-du-puits-de-cordes-sur-ciel-par-vinaigrette",st:"blog"}],
 "dourgne":[{t:{fr:"Saint Stapin et la grotte du Roc de l'Abbade",en:"Saint Stapin and the Cave of Roc de l'Abbade",oc:"Sant Estapin e la baumo del Ròc de l'Abbadie",de:"Der heilige Stapin und die Höhle vom Roc de l'Abbade",ja:"聖スタパンとロック・ド・ラバードの洞窟"},s:{fr:"(non officiel) Selon la tradition locale, Saint Stapin, personnage pieux du VIIe siècle, priait à genoux dans une grotte au sommet du Roc de l'Abbade qui domine Dourgne. Les habitants viennent encore le prier lorsqu'ils souffrent de douleurs articulaires. (non officiel)",en:"(unofficial) Local tradition holds that Saint Stapin, a pious 7th-century figure, prayed on his knees in a cave atop the Roc de l'Abbade overlooking Dourgne. Villagers still come to pray to him for relief from joint pain. (unofficial)",oc:"(non oficial) Segon la tradicion locala, Sant Estapin, personatge pietós del sègle VII, pregava de genolhs dins una baumo al som del Ròc de l'Abbadie que domina Dorgna. Los abitants vènon encara lo pregar quand sofrisson de dolors de las jonturas. (non oficial)",de:"(inoffiziell) Der örtlichen Überlieferung nach betete der heilige Stapin, eine fromme Gestalt des 7. Jahrhunderts, kniend in einer Höhle auf dem Roc de l'Abbade oberhalb von Dourgne. Die Bewohner beten noch heute zu ihm bei Gelenkschmerzen. (inoffiziell)",ja:"（非公式）地元の伝承によれば、7世紀の敬虔な人物である聖スタパンは、ドゥルーニュを見下ろすロック・ド・ラバード山頂の洞窟でひざまずいて祈ったという。住民は今も関節の痛みに苦しむとこの聖人に祈りを捧げる。（非公式）"},src:"https://histoire-caychac.e-monsite.com/album/famille-chauvin-perrin/dourgne-tarn.html",st:"blog"},{t:{fr:"L'abbaye Sainte-Scholastique, halte des pèlerins",en:"The Sainte-Scholastique Abbey, a Pilgrim Stop",oc:"L'abadiá Senta Escolastica, pausada dels pelegrins",de:"Die Abtei Sainte-Scholastique, eine Pilgerstation",ja:"巡礼者の宿場、サント＝スコラスティック修道院"},s:{fr:"Dourgne abrite l'abbaye Sainte-Scholastique, fondée en 1890, qui accueille aujourd'hui pèlerins et randonneurs sur le chemin de Compostelle.",en:"Dourgne is home to the Sainte-Scholastique Abbey, founded in 1890, which today welcomes pilgrims and hikers on the Way to Compostela.",oc:"Dorgna abriga l'abadiá Senta Escolastica, fondada en 1890, qu'acuelh uèi pelegrins e caminaires sul camin de Compostèla.",de:"Dourgne beherbergt die 1890 gegründete Abtei Sainte-Scholastique, die heute Pilger und Wanderer auf dem Jakobsweg empfängt.",ja:"ドゥルーニュには1890年創建のサント＝スコラスティック修道院があり、現在もコンポステーラ巡礼路の巡礼者やハイカーを迎えている。"},src:"https://compostelle-toulouse.com/?view=article&id=212:castres-dourgne&catid=70:nos-gites",st:"assoc"}],
 "teillet":[{t:{fr:"La Demoiselle de Berlan et le chevalier de Castelfranc",en:"The Maiden of Berlan and the Knight of Castelfranc",oc:"La Domaisèla de Berlan e lo cavalièr de Castelfranc",de:"Das Fräulein von Berlan und der Ritter von Castelfranc",ja:"ベルランの令嬢とカステルフランの騎士"},s:{fr:"(non officiel) Rattachée aux ruines du château de Berlan près de Teillet, cette légende raconte l'histoire romantique d'une jeune demoiselle de Berlan et d'un chevalier de Castelfranc, transmise localement comme un conte du patrimoine du village. (non officiel)",en:"(unofficial) Linked to the ruins of the Château de Berlan near Teillet, this legend tells the romantic story of a young maiden of Berlan and a knight of Castelfranc, passed down locally as a tale of the village's heritage. (unofficial)",oc:"(non oficial) Ligada a las roïnas del castèl de Berlan a costat de Teulet, aquesta legenda conta l'istòria romantica d'una jove domaisèla de Berlan e d'un cavalièr de Castelfranc, transmesa localament coma un conte del patrimòni del vilatge. (non oficial)",de:"(inoffiziell) Verbunden mit den Ruinen des Château de Berlan bei Teillet erzählt diese Legende die romantische Geschichte eines jungen Fräuleins von Berlan und eines Ritters von Castelfranc, die vor Ort als Erzählung des Dorferbes weitergegeben wird. (inoffiziell)",ja:"（非公式）テイエ近郊のベルラン城跡にまつわるこの伝説は、ベルランの令嬢とカステルフランの騎士のロマンチックな物語を語り、村の遺産の物語として地元で語り継がれている。（非公式）"},src:"https://histoire.teillet-meridienneverte.fr/",st:"assoc"}],
 "mazamet":[{t:{fr:"Le Peigne d'Or",en:"The Golden Comb",oc:"Lo Pinta d'Aur",de:"Der Goldene Kamm",ja:"黄金の櫛"},s:{fr:"La légende raconte qu'une fée aurait offert à Mazamet, ville de la laine et du délainage, un peigne d'or magique capable de démêler et de sublimer la laine, à l'origine de la prospérité de la cité drapière.",en:"Legend has it that a fairy gave Mazamet, a town built on wool and wool-processing, a magic golden comb able to untangle and enhance the wool, said to be at the root of the wool town's prosperity.",oc:"La legenda conta qu'una fada auriá ofèrt a Magamet, vila de la lana e del deslanatge, un pinta d'aur magic capable de desliar e de sublimar la lana, a l'origina de la prosperitat de la ciutat draperia.",de:"Der Legende nach schenkte eine Fee Mazamet, einer Stadt der Wolle und Wollverarbeitung, einen magischen goldenen Kamm, der die Wolle entwirren und veredeln konnte — der Ursprung des Wohlstands der Tuchmacherstadt.",ja:"羊毛加工の町マゼの伝説によれば、妖精が羊毛をほぐし輝かせる魔法の黄金の櫛を授け、それがこの毛織物の町の繁栄の起源になったという。"},src:"https://www.ville-mazamet.com/",st:"mairie"}],
 "puycelsi":[{t:{fr:"Le petit cochon de Puycelsi",en:"The Little Pig of Puycelsi",oc:"Lo pichon pòrc de Puègcelsi",de:"Das kleine Schwein von Puycelsi",ja:"ピュイセルシの小さな豚"},s:{fr:"(non officiel) Selon un récit local, lors d'un siège de la cité fortifiée, les assiégés auraient fait apparaître un dernier cochon sur les remparts pour convaincre les assaillants qu'ils avaient encore des vivres en abondance, les poussant à lever le siège. (non officiel)",en:"(unofficial) According to a local tale, during a siege of the fortified town, the besieged are said to have paraded their last pig atop the ramparts to convince the attackers they still had plentiful supplies, prompting them to give up the siege. (unofficial)",oc:"(non oficial) Segon un raconte local, pendent un sèti de la ciutat fortificada, los assetjats aurián fach paréisser lor darrièr pòrc sus las muralhas per convéncer los assalhents qu'avián encara de vivres en abondància, çò que los poussèt a levar lo sèti. (non oficial)",de:"(inoffiziell) Einer lokalen Erzählung zufolge sollen die Belagerten während einer Belagerung der befestigten Stadt ihr letztes Schwein auf den Wällen vorgeführt haben, um die Angreifer glauben zu machen, sie hätten noch reichlich Vorräte — woraufhin diese die Belagerung aufgaben. (inoffiziell)",ja:"（非公式）ある地元の話によれば、城塞都市が包囲された際、籠城側は最後の豚を城壁の上に見せつけ、攻撃側に食料がまだ豊富にあると思わせ、包囲を解かせたという。（非公式）"},src:"https://quiquequoi-gaillacois.org/",st:"assoc"}],
 "soreze":[{t:{fr:"Le marquis de Saint-Félix et la Grotte du Calel",en:"The Marquis de Saint-Félix and the Calel Cave",oc:"Lo marqués de Sant-Felix e la Bauma del Calèl",de:"Der Marquis de Saint-Félix und die Calel-Höhle",ja:"サン＝フェリックス侯爵とカレル洞窟"},s:{fr:"(non officiel) Selon la tradition orale rapportée par les spéléologues du Lauragais, il y a environ 300 ans, le marquis de Saint-Félix aurait exploré la Grotte du Calel, vêtu de souliers à boucle d'argent, accompagné de quatre laquais portant des flambeaux — rebroussant chemin dès qu'il atteignit l'eau souterraine. (non officiel)",en:"(unofficial) According to oral tradition recorded by Lauragais speleologists, about 300 years ago the Marquis de Saint-Félix is said to have explored the Calel Cave, wearing silver-buckled shoes and accompanied by four torch-bearing servants — turning back as soon as he reached the underground water. (unofficial)",oc:"(non oficial) Segon la tradicion orala rapportada pels espeleològs del Lauragués, i a environ 300 ans, lo marqués de Sant-Felix auriá exploratat la Bauma del Calèl, vestit de solièrs de bocla d'argent, acompanhat de quatre laquais que portavan de flambèus — virant tornarmai tre qu'atenguèt l'aiga sosterranha. (non oficial)",de:"(inoffiziell) Der mündlichen Überlieferung der Lauragais-Höhlenforscher zufolge soll der Marquis de Saint-Félix vor etwa 300 Jahren die Calel-Höhle erkundet haben, in Schuhen mit Silberschnallen und begleitet von vier fackeltragenden Dienern — er kehrte um, sobald er das unterirdische Wasser erreichte. (inoffiziell)",ja:"（非公式）ローラゲの洞窟探検家たちが伝える口承によれば、約300年前、サン＝フェリックス侯爵は銀のバックルの付いた靴を履き、松明を持つ4人の従者を伴ってカレル洞窟を探検したが、地下水にたどり着くとすぐに引き返したという。（非公式）"},src:"https://www.lauragais-patrimoine.fr/SPELEOLOGIE/INVENTAIRE10.html",st:"speleo"},{t:{fr:"Sorèze, commune halte du chemin de Compostelle",en:"Sorèze, an Official Stop on the Way to Compostela",oc:"Sorèza, comuna pausada del camin de Compostèla",de:"Sorèze, offizielle Pilgerstation am Jakobsweg",ja:"コンポステーラ巡礼路の公式宿場ソレーズ"},s:{fr:"Sorèze, désignée « commune halte » du chemin de Compostelle en 2023, fait traverser les pèlerins devant l'Abbaye-école (fondation bénédictine de 754) et le clocher Saint-Martin, seul vestige de l'ancienne église paroissiale détruite pendant les guerres de Religion.",en:"Sorèze, designated an official 'stopover commune' on the Way to Compostela in 2023, leads pilgrims past the Abbaye-école (a Benedictine foundation dating to 754) and the Saint-Martin bell tower, the sole remnant of the old parish church destroyed during the Wars of Religion.",oc:"Sorèza, designada « comuna pausada » del camin de Compostèla en 2023, fa traversar los pelegrins davant l'Abadiá-escòla (fondacion benedictina de 754) e lo cloquièr Sant Martin, sol vestigi de l'anciana glèisa parroquiala destrusida pendent las guèrras de Religion.",de:"Sorèze, 2023 zur offiziellen „Pilgerhaltestelle“ am Jakobsweg ernannt, führt Pilger an der Abbaye-école (einer 754 gegründeten Benediktinerabtei) und dem Glockenturm Saint-Martin vorbei, dem einzigen Überrest der während der Religionskriege zerstörten alten Pfarrkirche.",ja:"2023年にコンポステーラ巡礼路の公式「休憩コミューン」に指定されたソレーズでは、巡礼者は754年創建のベネディクト会修道院学校と、宗教戦争で破壊された旧教区教会の唯一の遺構であるサン＝マルタン鐘楼の前を通る。"},src:"https://www.ville-soreze.fr/chemins-de-compostelle/",st:"tourism"}],
 "ambialet":[{t:{fr:"La légende de l'Oder, l'arbre du croisé",en:"The Legend of the Oder, the Crusader's Tree",oc:"La legenda de l'Oder, l'arbre del crosat",de:"Die Legende vom Oder, dem Baum des Kreuzfahrers",ja:"十字軍兵士の木、オデールの伝説"},s:{fr:"(non officiel) Selon la légende, l'arbousier appelé « l'Oder » (ou Notre-Dame de l'Auder), conservé dans une petite cour du prieuré d'Ambialet, aurait été rapporté de Terre Sainte par un croisé de retour des Croisades. Devenu fragile avec les siècles, cet arbre tenace reverdit toujours et demeure un symbole préservé par les gardiens du prieuré. (non officiel)",en:"(unofficial) According to legend, the strawberry tree called “l'Oder” (or Notre-Dame de l'Auder), kept in a small courtyard of the Ambialet priory, was said to have been brought back from the Holy Land by a returning crusader. Grown fragile over the centuries, this stubborn tree still turns green each year and remains a symbol preserved by the priory's keepers. (unofficial)",oc:"(non oficial) Segon la legenda, l'arboç nomenat « l'Oder » (o Nòstra-Dama de l'Auder), gardat dins una pichona cort del priorat d'Ambialet, auriá estat rapportat de Tèrra Santa per un crosat tornant de las Crosadas. Venguda fragila amb los sègles, aquesta arbre tenaç revèrdeja totjorn e demòra un simbòl gardat pels gardians del priorat. (non oficial)",de:"(inoffiziell) Der Legende nach soll der Erdbeerbaum namens „l'Oder“ (oder Notre-Dame de l'Auder), der in einem kleinen Hof des Priorats von Ambialet steht, von einem heimkehrenden Kreuzritter aus dem Heiligen Land mitgebracht worden sein. Über die Jahrhunderte brüchig geworden, treibt dieser zähe Baum noch immer jedes Jahr neu aus und bleibt ein von den Hütern des Priorats bewahrtes Symbol. (inoffiziell)",ja:"（非公式）伝説によれば、アンビアレ修道院の小さな中庭に残る「オデール」（またはノートル＝ダム・ド・ロデール）と呼ばれるイチゴノキは、聖地から帰還した十字軍兵士が持ち帰ったものだという。何世紀もの間にもろくなりながらも、この頑強な木は今も毎年芽吹き、修道院の守り手たちによって大切にされる象徴であり続けている。（非公式）"},src:"https://www.poliphile.fr/loder-larbre-tenace-dambialet/",st:"blog"}],
 "tanus":[{t:{fr:"Le capitaine Mauléon et la prise du fort des Planques",en:"Captain Mauléon and the Capture of Fort des Planques",oc:"Lo capitani Mauleon e la presa del fòrt de las Plancas",de:"Hauptmann Mauléon und die Einnahme des Forts des Planques",ja:"モーレオン大尉とプランク砦の攻略"},s:{fr:"(non officiel) Selon une tradition locale des gorges du Viaur, le capitaine Mauléon et cinq de ses soldats se seraient déguisés en femmes pour s'infiltrer dans la forteresse des Planques, sur la commune de Tanus, et s'en emparer par ruse en 1381. Le récit lui-même reconnaît qu'il ne s'agit peut-être que d'une légende transmise de génération en génération dans la vallée. (non officiel)",en:"(unofficial) According to local tradition from the Viaur gorges, Captain Mauléon and five of his soldiers are said to have disguised themselves as women to infiltrate the Les Planques fortress, in the commune of Tanus, and seize it by trickery in 1381. The account itself acknowledges it may only be a legend passed down through generations in the valley. (unofficial)",oc:"(non oficial) Segon una tradicion locala de las gòrjas del Viaur, lo capitani Mauleon e cinc de sos soldats se serián desguisats en femnas per s'infiltrar dins la fortalesa de las Plancas, sus la comuna de Tanus, e la prendre per astúcia en 1381. Lo raconte meteis reconeis que se pòt tractar solament d'una legenda transmesa de generacion en generacion dins la comba. (non oficial)",de:"(inoffiziell) Der lokalen Überlieferung aus den Viaur-Schluchten zufolge sollen sich Hauptmann Mauléon und fünf seiner Soldaten als Frauen verkleidet haben, um die Festung Les Planques in der Gemeinde Tanus zu infiltrieren und sie 1381 durch List einzunehmen. Der Bericht selbst räumt ein, dass es sich möglicherweise nur um eine über Generationen im Tal weitergegebene Legende handelt. (inoffiziell)",ja:"（非公式）ヴィアール渓谷の地元伝承によれば、モーレオン大尉と5人の兵士は女性に変装してタニュス村のプランク要塞に潜入し、1381年に策略でこれを陥落させたという。この話自体、谷で世代を超えて語り継がれた伝説に過ぎない可能性があると述べている。（非公式）"},src:"https://www.dedans-dehors.com/2020/05/legendes-et-histoires-secretes-des-gorges-du-viaur.html",st:"blog"}],
 "villeneuve-sur-vere":[{t:{fr:"Le vœu à Notre-Dame de La Gardelle contre la peste",en:"The Vow to Notre-Dame de La Gardelle Against the Plague",oc:"Lo vòt a Nòstra-Dama de La Gardèla contra la pèsta",de:"Das Gelübde an Notre-Dame de La Gardelle gegen die Pest",ja:"疫病に対するノートル＝ダム・ド・ラ・ガルデルへの誓願"},s:{fr:"En 1631, les habitants de Villeneuve-sur-Vère auraient imploré Notre-Dame de La Gardelle, invoquée comme « salut des infirmes », pour les protéger d'une épidémie de peste. En reconnaissance, ils firent le vœu d'une procession annuelle jusqu'à la chapelle de La Gardelle le lundi de Pâques, tradition qui, selon la commune, se perpétue encore aujourd'hui.",en:"In 1631, the people of Villeneuve-sur-Vère are said to have implored Notre-Dame de La Gardelle, invoked as “healer of the sick,” to protect them from a plague epidemic. In gratitude, they vowed an annual procession to the La Gardelle chapel on Easter Monday, a tradition the commune says continues to this day.",oc:"En 1631, los abitants de Vilanòva de Vèra aurián implorat Nòstra-Dama de La Gardèla, invocada coma « salvament dels malauts », per los protegir d'una epidèmia de pèsta. En reconoissença, faguèron lo vòt d'una procession anuala fins a la capèla de La Gardèla lo diluns de Pascas, tradicion que, segon la comuna, se perpetua encara uèi.",de:"1631 sollen die Bewohner von Villeneuve-sur-Vère Notre-Dame de La Gardelle, angerufen als „Heilerin der Kranken“, um Schutz vor einer Pestepidemie gebeten haben. Aus Dankbarkeit gelobten sie eine jährliche Prozession zur Kapelle von La Gardelle am Ostermontag – eine Tradition, die laut der Gemeinde bis heute fortbesteht.",ja:"1631年、ヴィルヌーヴ＝シュル＝ヴェールの住民たちは「病人の救い」として崇められるノートル＝ダム・ド・ラ・ガルデルに疫病からの保護を願ったと伝えられる。その感謝として、復活祭翌月曜日にラ・ガルデル礼拝堂まで毎年巡礼する誓いを立て、この伝統は今日も続いていると村は伝えている。"},src:"https://www.villeneuvesurvere.fr/histoire-villeneuve-sur-vere-81",st:"mairie"}]};

// Builds the icon row + label for one site, shared by the native (hidden) select's plain-text
// option and the custom dropdown's rich HTML row.
function villageIconsHtml(x){
 var n=(LEGENDS[x.id]||[]).length;
 var hasTrail=!!TRAILS[x.id];
 var hasComp=!!COMPOSTELLE[x.id];
 var hasWine=!!WINERIES[x.id];
 var hasTpl=!!TEMPLARS[x.id];
 var hasPeak=!!PEAKS[x.id];
 var hasCathar=!!CATHARS[x.id];
 var hasChurch=!!CHURCHES[x.id];
 var hasCave=!!CAVES[x.id];
 var hasRecipe=!!RECIPES[x.id];
 return (n?ICONS.star:'')+(hasTrail?ICONS.walker:'')+(hasComp?ICONS.shell:'')+(hasWine?ICONS.grapes:'')+(hasTpl?ICONS.templar:'')+(hasPeak?ICONS.peak:'')+(hasCathar?ICONS.goldenDove:'')+(hasChurch?ICONS.cross:'')+(hasCave?ICONS.cave:'')+(hasRecipe?ICONS.spoonfork:'');
}
function renderVillageOptionsList(list){
 var selEl=$("vsearch"),listEl=$("vsearchList");if(!selEl)return;
 var opts=['<option value="">'+TXT[lang].searchLabel+'</option>'];
 var customHtml=[];
 list.forEach(function(x){
  var n=(LEGENDS[x.id]||[]).length;
  opts.push('<option value="'+x.id+'"'+(n?' style="color:#c62828;font-weight:700"':'')+'>'+shortVillageName(x.n)+(n?' ('+n+')':'')+'</option>');
  var icons=villageIconsHtml(x);
  customHtml.push('<div class="customSelect-item'+(n?' legend':'')+(x.id===sel?' hi':'')+'" data-value="'+x.id+'" role="option">'+(icons?icons+' ':'')+shortVillageName(x.n)+(n?' ('+n+')':'')+'</div>');

function distKm(la1,lo1,la2,lo2){
 var R=6371,toRad=Math.PI/180;
 var dLa=(la2-la1)*toRad,dLo=(lo2-lo1)*toRad;
 var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*toRad)*Math.cos(la2*toRad)*Math.sin(dLo/2)*Math.sin(dLo/2);
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

   en:["The day before, soak the stale bread in the beaten eggs.","Desalt the casings in water, then soak them in water with a little lemon juice.","Cut the meat into large pieces and grind the fat and lean together.","Mix the ground meat, the bread-and-egg mixture, salt and pepper.","Tie one end of each casing, fill to half capacity (it swells as it cooks), then seal with a double knot.","Poach for 2 hours in barely simmering water, never boiling, pricking regularly so the casings don't burst.","Leave to dry overnight on straw or a cloth.","Enjoy cold in slices, or pan-fried with a salad."]}},
  {name:{fr:"G\u00e2teau \u00e0 la broche",en:"Spit cake (g\u00e2teau \u00e0 la broche)"},
  ingredients:{fr:["24 oeufs","1 kg de beurre","1 kg de farine","1 kg de sucre","1 verre de rhum","Ar\u00f4me de vanille","Papier sulfuris\u00e9","Un moule conique en bois","Un feu de chemin\u00e9e"],
   en:["24 eggs","1 kg butter","1 kg flour","1 kg sugar","1 glass of rum","Vanilla flavouring","Baking paper","A conical wooden mould","A fireplace fire"]},
  steps:{fr:["Allumer un feu de chemin\u00e9e et installer le moule conique (travers\u00e9 d'une broche m\u00e9tallique pos\u00e9e sur deux tr\u00e9teaux) devant les flammes, avec un plat en dessous pour recueillir la p\u00e2te qui coule.","Battre les oeufs avec le sucre, puis incorporer la farine et le beurre fondu. Ajouter le rhum et la vanille.","Envelopper le c\u00f4ne de papier sulfuris\u00e9, bien le fixer et le badigeonner g\u00e9n\u00e9reusement de beurre. Le faire chauffer devant le feu.","Verser la p\u00e2te petit \u00e0 petit sur le moule pendant qu'une autre personne tourne la broche r\u00e9guli\u00e8rement.","R\u00e9cup\u00e9rer la p\u00e2te qui tombe et la reverser sur le g\u00e2teau. Continuer \u00e0 tourner et \u00e0 verser jusqu'\u00e0 \u00e9puisement de la p\u00e2te."],
   en:["Light a fireplace fire and set the conical mould (fitted on a metal spit over two trestles) in front of it, with a dish underneath to catch dripping batter.","Beat the eggs with the sugar, then fold in the flour and melted butter. Add the rum and vanilla.","Wrap the cone in baking paper, secure it well and brush it generously with butter. Warm it in front of the fire.","Pour the batter gradually over the mould while another person turns the spit steadily.","Collect any batter that drips off and pour it back over the cake. Keep turning and pouring until the batter is used up."]}}],
 "castres":[{name:{fr:"Bougnette du Tarn",en:"Tarn bougnette"},
  ingredients:{fr:["4 kg de pain rassis","12 oeufs","3 kg de collet de porc","Cr\u00e9pine de porc","Graisse fine pour la friture","Sel, poivre"],
   en:["4 kg stale bread","12 eggs","3 kg pork neck (collet)","Pork caul fat (cr\u00e9pine)","Fine fat for frying","Salt, pepper"]},
  steps:{fr:["M\u00e9langer la mie de pain rassis aux oeufs et assaisonner selon le go\u00fbt.","Couper le collet de porc en d\u00e9s et le faire cuire \u00e0 point.","Ajouter la viande cuite au m\u00e9lange de pain et d'oeufs.","Former des boules d'environ 15 cm de diam\u00e8tre.","Envelopper chaque boule dans la cr\u00e9pine de porc.","Faire frire dans la graisse fine jusqu'\u00e0 ce qu'elles prennent une belle couleur caramel.","Se d\u00e9guste chaude ou froide, cuite au four, s\u00e9ch\u00e9e ou grill\u00e9e."],
   en:["Mix the stale bread crumb with the eggs and season to taste.","Dice the pork neck and cook it through.","Add the cooked meat to the bread-and-egg mixture.","Shape into balls about 15 cm across.","Wrap each ball in pork caul fat.","Fry in fine fat until caramel-coloured all over.","Enjoy warm or cold, oven-baked, dried or grilled."]}},
  {name:{fr:"Croustade aux pommes du Tarn",en:"Tarn apple croustade"},
  ingredients:{fr:["6 pommes du Tarn","400 g de farine de bl\u00e9 (type 55)","100 g de sucre glace","4 oeufs","1 citron","1 cuill\u00e8re \u00e0 soupe d'eau de fleur d'oranger","1 cuill\u00e8re \u00e0 soupe d'huile","1 cuill\u00e8re \u00e0 soupe de miel du Tarn","Sel"],
   en:["6 Tarn apples","400 g wheat flour (T55)","100 g icing sugar","4 eggs","1 lemon","1 tbsp orange blossom water","1 tbsp oil","1 tbsp Tarn honey","Salt"]},
  steps:{fr:["Casser les oeufs, ajouter la farine, le sucre, l'eau de fleur d'oranger, l'huile et une pinc\u00e9e de sel. M\u00e9langer jusqu'\u00e0 obtenir une boule de p\u00e2te, en ajoutant un peu d'eau si besoin.","Former deux boules de p\u00e2te \u00e9gales et laisser reposer 3 heures.","Pr\u00e9chauffer le four \u00e0 200\u00b0C.","Presser le citron. Laver, peler et \u00e9p\u00e9piner les pommes, puis les couper en fines lamelles. Les enrober de jus de citron et de miel.","Beurrer le moule et \u00e9taler la premi\u00e8re boule de p\u00e2te au fond. Garnir de pommes.","\u00c9tirer la seconde boule de p\u00e2te par-dessus et pincer les bords.","D\u00e9couper un petit trou au centre et y glisser une bande de papier sulfuris\u00e9 roul\u00e9e en chemin\u00e9e.","Enfourner environ 20 minutes. Saupoudrer de sucre glace encore ti\u00e8de."],
   en:["Break the eggs, add the flour, sugar, orange blossom water, oil and a pinch of salt. Mix into a smooth dough ball, adding a little water if needed.","Divide into two equal dough balls and rest for 3 hours.","Preheat the oven to 200\u00b0C.","Juice the lemon. Wash, peel and core the apples, then slice thinly. Coat them in lemon juice and honey.","Butter the tin and line it with the first dough ball. Fill with the apples.","Stretch the second dough ball over the top and pinch the edges together.","Cut a small hole in the centre and slide in a rolled strip of baking paper as a little chimney.","Bake for about 20 minutes. Dust with icing sugar while still warm."]}},
  {name:{fr:"Millas",en:"Millas (cornmeal cake)"},
  ingredients:{fr:["125 g de farine de ma\u00efs","50 g de farine de bl\u00e9","600 ml de lait entier","120 g de sucre","4 oeufs","50 g de beurre (+ pour le moule)","1 pinc\u00e9e de sel","1 cuill\u00e8re \u00e0 soupe d'eau de fleur d'oranger (facultatif)"],
   en:["125 g cornmeal","50 g wheat flour","600 ml whole milk","120 g sugar","4 eggs","50 g butter (plus extra for the tin)","Pinch of salt","1 tbsp orange blossom water (optional)"]},
  steps:{fr:["Pr\u00e9chauffer le four \u00e0 170\u00b0C.","Chauffer le lait jusqu'\u00e0 ce qu'il fume, sans le laisser bouillir.","M\u00e9langer la farine de ma\u00efs, la farine de bl\u00e9, le sucre et le sel dans un saladier.","Verser le lait chaud petit \u00e0 petit sur le m\u00e9lange sec en fouettant pour \u00e9viter les grumeaux.","Remettre sur le feu et cuire 5 minutes \u00e0 feu doux en remuant sans arr\u00eat.","Retirer du feu, ajouter le beurre en morceaux et laisser ti\u00e9dir l\u00e9g\u00e8rement.","Incorporer les oeufs un par un, puis l'eau de fleur d'oranger si d\u00e9sir\u00e9.","Beurrer g\u00e9n\u00e9reusement un moule et y verser la pr\u00e9paration.","Enfourner environ 40 minutes, jusqu'\u00e0 ce que le dessus soit dor\u00e9 et qu'une lame ressorte propre."],
   en:["Preheat the oven to 170\u00b0C.","Heat the milk until steaming, without letting it boil.","Mix the cornmeal, wheat flour, sugar and salt in a bowl.","Pour the hot milk gradually over the dry mix, whisking to avoid lumps.","Return to low heat and cook for 5 minutes, stirring constantly.","Remove from the heat, add the butter in pieces and let cool slightly.","Beat in the eggs one at a time, then the orange blossom water if using.","Butter a baking dish generously and pour in the batter.","Bake for about 40 minutes, until golden on top and a knife comes out clean."]}},
  {name:{fr:"Fabounade tarnaise",en:"Tarn fabounade (broad bean cassoulet)"},
  ingredients:{fr:["750 g de f\u00e8ves fra\u00eeches \u00e9cossées","2 andouilles","50 cm de saucisse de foie ou de canard","6 morceaux de confit de canard","200 g de couennes de porc","1 grosse tranche de jambon de pays","4 gousses d'ail rose de Lautrec","1 gros oignon","2 carottes","3 brins de persil plat","1 bouquet garni","2 clous de girofle","2 cuill\u00e8res \u00e0 soupe de graisse de canard","Sel, poivre"],
   en:["750 g fresh shelled broad (fava) beans","2 andouille sausages","50 cm liver or duck sausage","6 pieces duck confit","200 g pork rind","1 thick slice country ham","4 cloves Lautrec pink garlic","1 large onion","2 carrots","3 sprigs flat parsley","1 bouquet garni","2 cloves","2 tbsp duck fat","Salt, pepper"]},
  steps:{fr:["\u00c9mincer l'ail et le persil, couper les carottes en fines rondelles, piquer l'oignon des clous de girofle.","Blanchir les couennes 2 minutes puis les \u00e9goutter.","Couper le jambon en petits d\u00e9s.","Faire chauffer la graisse de canard dans une grande cocotte, ajouter les f\u00e8ves, le jambon, les carottes, l'ail et le persil.","Faire revenir 20 minutes \u00e0 feu doux en remuant r\u00e9guli\u00e8rement.","Dans une autre po\u00eale, r\u00e9chauffer les morceaux de confit et les \u00e9goutter ; faire revenir la saucisse dans la m\u00eame po\u00eale.","Ajouter le confit et la saucisse dans la cocotte avec le bouquet garni, sel et poivre.","Verser 500 ml d'eau chaude, couvrir et laisser mijoter doucement 1h10.","Retirer le bouquet garni et l'oignon avant de servir."],
   en:["Mince the garlic and parsley, slice the carrots thinly, and stud the onion with the cloves.","Blanch the pork rind for 2 minutes, then drain.","Dice the ham finely.","Heat the duck fat in a large pot and add the beans, ham, carrots, garlic and parsley.","Cook gently for 20 minutes over low heat, stirring regularly.","In a separate pan, warm the confit pieces and drain them, then brown the sausage in the same pan.","Add the confit and sausage to the pot with the bouquet garni, salt and pepper.","Pour in 500 ml warm water, cover and simmer gently for 1 hour 10 minutes.","Remove the bouquet garni and onion before serving."]}}],
 "brassac":[{name:{fr:"Casse-museau de Brassac",en:"Casse-museau de Brassac (curd cake)"},
  ingredients:{fr:["3 litres de lait de brebis","4 oeufs","75 g de farine","1/2 cuill\u00e8re \u00e0 caf\u00e9 de pr\u00e9sure","2,5 g de levure en poudre","Zeste d'1/2 citron","Beurre et sucre glace"],
   en:["3 litres sheep's milk","4 eggs","75 g flour","1/2 tsp rennet","2.5 g powdered yeast","Zest of 1/2 lemon","Butter and icing sugar"]},
  steps:{fr:["Chauffer le lait de brebis \u00e0 32\u00b0C, ajouter la pr\u00e9sure et bien fouetter.","Laisser reposer environ 1 heure \u00e0 temp\u00e9rature ambiante.","\u00c9goutter le caill\u00e9 dans une \u00e9tamine.","M\u00e9langer le caill\u00e9 \u00e9goutt\u00e9 avec les oeufs, la farine, le zeste de citron et la levure.","Former des boules d'environ 175 g chacune.","Les disposer sur une plaque l\u00e9g\u00e8rement beurr\u00e9e recouverte de papier cuisson.","Pr\u00e9chauffer le four \u00e0 250\u00b0C et enfourner 10 \u00e0 15 minutes jusqu'\u00e0 coloration.","Inciser une croix sur le dessus de chaque boule.","Terminer la cuisson \u00e0 100\u00b0C pendant environ 20 minutes.","Laisser refroidir compl\u00e8tement et saupoudrer de sucre glace avant de servir."],
   en:["Heat the sheep's milk to 32\u00b0C, add the rennet and whisk well.","Leave to rest for about 1 hour at room temperature.","Drain the curds through cheesecloth.","Mix the drained curd with the eggs, flour, lemon zest and yeast.","Shape into balls of about 175 g each.","Place on a lightly buttered, parchment-lined baking sheet.","Preheat the oven to 250\u00b0C and bake for 10-15 minutes until golden.","Score a cross on top of each ball.","Finish cooking at 100\u00b0C for about 20 minutes.","Leave to cool completely and dust with icing sugar before serving."]}}],
 "cordes-sur-ciel":[{name:{fr:"Croquants de Cordes",en:"Croquants de Cordes (almond biscuits)"},
  ingredients:{fr:["2 blancs d'oeufs","220 g de sucre glace","50 g de farine tamis\u00e9e","125 g d'amandes enti\u00e8res"],
   en:["2 egg whites","220 g icing sugar","50 g sifted flour","125 g whole almonds"]},
  steps:{fr:["Pr\u00e9chauffer le four \u00e0 200\u00b0C. Torr\u00e9fier les amandes enti\u00e8res sur une plaque pendant 15 \u00e0 20 minutes.","Les sortir du four, les transf\u00e9rer sur un torchon et les frotter pour retirer la peau s\u00e9ch\u00e9e.","Concasser grossi\u00e8rement les amandes torr\u00e9fi\u00e9es.","M\u00e9langer la farine et le sucre, creuser un puits, verser les blancs d'oeufs et m\u00e9langer vigoureusement.","Incorporer les amandes concass\u00e9es jusqu'\u00e0 obtenir un m\u00e9lange homog\u00e8ne.","D\u00e9poser de petites portions \u00e0 la cuill\u00e8re \u00e0 caf\u00e9 sur une plaque recouverte de papier cuisson.","Enfourner \u00e0 200\u00b0C jusqu'\u00e0 l\u00e9g\u00e8re coloration, environ dix minutes.","Laisser refroidir compl\u00e8tement jusqu'\u00e0 ce qu'ils durcissent avant de les d\u00e9coller."],
   en:["Preheat the oven to 200\u00b0C. Toast the whole almonds on a tray for 15-20 minutes.","Remove from the oven, transfer to a tea towel and rub to remove the dried skins.","Roughly chop the toasted almonds.","Mix the flour and sugar, make a well, pour in the egg whites and mix vigorously.","Fold in the chopped almonds until the mixture is even.","Drop small teaspoons of batter onto a parchment-lined baking sheet.","Bake at 200\u00b0C until lightly coloured, about ten minutes.","Let cool completely until hardened before lifting off the sheet."]}}],
 "soual":[{name:{fr:"Poumpet",en:"Poumpet (lemon puff-pastry cake)"},
  ingredients:{fr:["4 \u00e0 5 gros citrons jaunes bio (m\u00fbrs et non trait\u00e9s)","150 g de sucre","1 cuill\u00e8re \u00e0 soupe de sucre (pour la finition)","2 rouleaux de p\u00e2te feuillet\u00e9e","20 g de beurre","Un peu d'eau"],
   en:["4-5 large unwaxed lemons, ripe","150 g sugar","1 tbsp sugar (to finish)","2 sheets puff pastry","20 g butter","A little water"]},
  steps:{fr:["Pr\u00e9chauffer le four \u00e0 180\u00b0C (thermostat 6).","Pr\u00e9lever les zestes des citrons.","M\u00e9langer les zestes avec le sucre, le beurre fondu et un peu d'eau jusqu'\u00e0 obtenir un m\u00e9lange p\u00e2teux.","D\u00e9rouler une p\u00e2te feuillet\u00e9e et y \u00e9taler la pr\u00e9paration, sans piquer la p\u00e2te.","Recouvrir avec la seconde p\u00e2te feuillet\u00e9e, replier et souder les bords, puis piquer le dessus.","Enfourner environ 20 minutes.","Saupoudrer de sucre \u00e0 la sortie du four et laisser refroidir avant de d\u00e9guster."],
   en:["Preheat the oven to 180\u00b0C (gas mark 6).","Zest the lemons.","Mix the zest with the sugar, melted butter and a little water into a paste.","Unroll one sheet of puff pastry and spread the mixture over it, without pricking the pastry.","Cover with the second sheet of pastry, fold and seal the edges, then prick the top.","Bake for about 20 minutes.","Dust with sugar as soon as it comes out of the oven and leave to cool before serving."]}}]
};

 var box=$("guidesSection");if(!box)return;var T=TXT[lang];
 box.innerHTML='<div style="text-align:center;margin:0 0 8px"><span style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#4a3620,#2e2012);border:1.5px solid var(--lantern)">'+ICONS.compass.replace("width=\"20\" height=\"20\"","width=\"30\" height=\"30\"")+'</span></div>'+
  '<h2 style="text-align:center;margin:0 0 10px">'+T.guidesTitle+'</h2>'+

  '<a class="lnk" href="tel:'+AGIT_CONTACT.phone.replace(/ /g,'')+'">'+AGIT_CONTACT.phone+'</a>'+

  '</div>'+
